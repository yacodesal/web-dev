<!DOCTYPE html>
<html>
  <head>
    <title>Tic-Tac-Toe!</title>

     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Diplomata&family=Love+Ya+Like+A+Sister&family=Vina+Sans&display=swap" rel="stylesheet">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Diplomata&display=swap" rel="stylesheet">

<link rel="stylesheet" href="ttt.css">
  </head>

  
    <body>
      <div>
        <h1>TIC-TAC-TOE</h1>
        <h3>X goes first!</h3>
      </div>
    </head>
    
    <div class="ttt-row">
      <div class="ttt-square"></div>
      <div class="ttt-square"></div>
      <div class="ttt-square"></div>
    </div>
    <div class="ttt-row">
      <div class="ttt-square"></div>
      <div class="ttt-square"></div>
      <div class="ttt-square"></div>
    </div>
    <div class="ttt-row" >
      <div class="ttt-square ttt-bottom"></div>
      <div class="ttt-square ttt-bottom"></div>
      <div class="ttt-square ttt-bottom"></div>
    </div>
    
    <div id="end-of-game">
      <div>
        <p>🥳X player Wins!🥳</p>
        <button onclick="resetGame()">Play Again</button>
      </div>
    </div>


  <script src="ttt.js"></script>
    </body>
  
</html>
